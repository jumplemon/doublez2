<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepL Translator - YouTube Translation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 30px;
      font-size: 28px;
    }
    
    h1 span {
      color: #0f5fd7;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #555;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    textarea {
      width: 100%;
      height: 150px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      resize: vertical;
      transition: border-color 0.3s;
    }
    
    textarea:focus {
      outline: none;
      border-color: #0f5fd7;
    }
    
    .lang-row {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .lang-select {
      flex: 1;
    }
    
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      background: white;
      cursor: pointer;
    }
    
    select:focus {
      outline: none;
      border-color: #0f5fd7;
    }
    
    .btn-translate {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #0f5fd7 0%, #1a73e8 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-translate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(15,95,215,0.4);
    }
    
    .btn-translate:active {
      transform: translateY(0);
    }
    
    .btn-translate:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .result {
      margin-top: 25px;
      display: none;
    }
    
    .result.show {
      display: block;
    }
    
    .result-box {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      min-height: 120px;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #333;
      line-height: 1.6;
    }
    
    .result-label {
      color: #888;
      font-size: 13px;
      margin-bottom: 8px;
    }
    
    .error {
      background: #fee;
      color: #c00;
      padding: 15px;
      border-radius: 12px;
      display: none;
    }
    
    .error.show {
      display: block;
    }
    
    .copy-btn {
      margin-top: 10px;
      padding: 10px 20px;
      background: #e0e0e0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    .copy-btn:hover {
      background: #d0d0d0;
    }
    
    .copy-btn.copied {
      background: #4caf50;
      color: white;
    }
    
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: #0f5fd7;
    }
    
    .loading.show {
      display: block;
    }
    
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #e0e0e0;
      border-top-color: #0f5fd7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .footer {
      text-align: center;
      margin-top: 30px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 <span>DeepL</span> Translator</h1>
    
    <div class="input-group">
      <label>中文原文</label>
      <textarea id="sourceText" placeholder="输入要翻译的中文..."></textarea>
    </div>
    
    <div class="lang-row">
      <div class="lang-select">
        <label>源语言</label>
        <select id="sourceLang">
          <option value="ZH" selected>中文</option>
          <option value="EN">英文</option>
          <option value="JA">日文</option>
          <option value="KO">韩文</option>
          <option value="FR">法文</option>
          <option value="DE">德文</option>
          <option value="ES">西班牙文</option>
          <option value="PT">葡萄牙文</option>
          <option value="RU">俄文</option>
          <option value="IT">意大利文</option>
        </select>
      </div>
      <div class="lang-select">
        <label>目标语言</label>
        <select id="targetLang">
          <option value="EN-US" selected>英文 (美国)</option>
          <option value="EN-GB">英文 (英国)</option>
          <option value="ZH">中文</option>
          <option value="JA">日文</option>
          <option value="KO">韩文</option>
          <option value="FR">法文</option>
          <option value="DE">德文</option>
          <option value="ES">西班牙文</option>
          <option value="PT">葡萄牙文</option>
          <option value="RU">俄文</option>
          <option value="IT">意大利文</option>
        </select>
      </div>
    </div>
    
    <button class="btn-translate" id="translateBtn" onclick="translate()">翻译</button>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>翻译中...</div>
    </div>
    
    <div class="error" id="error"></div>
    
    <div class="result" id="result">
      <div class="result-label">翻译结果</div>
      <div class="result-box" id="resultText"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyResult()">复制结果</button>
    </div>
    
    <div class="footer">
      Powered by DeepL API • 本地化翻译
    </div>
  </div>
  
  <script>
    async function translate() {
      const sourceText = document.getElementById('sourceText').value.trim();
      const sourceLang = document.getElementById('sourceLang').value;
      const targetLang = document.getElementById('targetLang').value;
      const btn = document.getElementById('translateBtn');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const result = document.getElementById('result');
      
      if (!sourceText) {
        error.textContent = '请输入要翻译的文字';
        error.classList.add('show');
        return;
      }
      
      error.classList.remove('show');
      result.classList.remove('show');
      btn.disabled = true;
      loading.classList.add('show');
      
      try {
        const response = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: sourceText,
            source_lang: sourceLang,
            target_lang: targetLang
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || '翻译失败');
        }
        
        const translation = data.data?.translations?.[0]?.text || '无结果';
        document.getElementById('resultText').textContent = translation;
        result.classList.add('show');
        
      } catch (err) {
        error.textContent = '翻译失败: ' + err.message;
        error.classList.add('show');
      } finally {
        btn.disabled = false;
        loading.classList.remove('show');
      }
    }
    
    function copyResult() {
      const text = document.getElementById('resultText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '已复制 ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '复制结果';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
